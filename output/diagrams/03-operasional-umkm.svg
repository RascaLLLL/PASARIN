<text x="800" y="2040" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#59636B">UC-16 dirinci menjadi tambah, ubah, dan hapus. NIB opsional dicatat sebagai aturan dokumen.</text>
