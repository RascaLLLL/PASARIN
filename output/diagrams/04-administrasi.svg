<text x="665" y="1697" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="normal" font-style="normal" fill="#202A31">akun pemilik</text>
<polygon points="980,420 1292,420 1310,438 1310,625 980,625" fill="white" stroke="#59636B" stroke-width="1.3"/>
<polyline points="1292,420 1292,438 1310,438" fill="none" stroke="#59636B" stroke-width="1.3"/>
<text x="998" y="452" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#202A31">Verifikasi identitas</text>
<text x="998" y="483" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Pemeriksaan sekali per akun.</text>
<text x="998" y="511" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Setujui atau minta perbaikan</text>
<text x="998" y="539" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">beserta alasan. Publikasi</text>
<text x="998" y="567" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">toko berjalan terpisah.</text>
<polygon points="980,725 1292,725 1310,743 1310,958 980,958" fill="white" stroke="#59636B" stroke-width="1.3"/>
<polyline points="1292,725 1292,743 1310,743" fill="none" stroke="#59636B" stroke-width="1.3"/>
<text x="998" y="757" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#202A31">Moderasi setelah tayang</text>
<text x="998" y="788" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Tinjau laporan produk, toko,</text>
<text x="998" y="816" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">atau ulasan. Pertahankan,</text>
<text x="998" y="844" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">sembunyikan, atau tampilkan</text>
<text x="998" y="872" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">kembali konten dengan</text>
<text x="998" y="900" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">alasan keputusan.</text>
<polygon points="980,1060 1292,1060 1310,1078 1310,1265 980,1265" fill="white" stroke="#59636B" stroke-width="1.3"/>
<polyline points="1292,1060 1292,1078 1310,1078" fill="none" stroke="#59636B" stroke-width="1.3"/>
<text x="998" y="1092" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#202A31">Kelola toko dan produk</text>
<text x="998" y="1123" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Toko: ubah data, aktifkan,</text>
<text x="998" y="1151" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">atau nonaktifkan.</text>
<text x="998" y="1179" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Produk: ubah data,</text>
<text x="998" y="1207" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">sembunyikan / tampilkan.</text>
<polygon points="980,1370 1292,1370 1310,1388 1310,1575 980,1575" fill="white" stroke="#59636B" stroke-width="1.3"/>
<polyline points="1292,1370 1292,1388 1310,1388" fill="none" stroke="#59636B" stroke-width="1.3"/>
<text x="998" y="1402" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#202A31">Pemblokiran pemilik</text>
<text x="998" y="1433" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Blokir berlaku pada seluruh</text>
<text x="998" y="1461" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">toko dan produk pemilik.</text>
<text x="998" y="1489" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Alasan wajib dicatat.</text>
<text x="998" y="1517" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Admin dapat membuka blokir.</text>
<polygon points="410,1800 942,1800 960,1818 960,1915 410,1915" fill="white" stroke="#59636B" stroke-width="1.3"/>
<polyline points="942,1800 942,1818 960,1818" fill="none" stroke="#59636B" stroke-width="1.3"/>
<text x="428" y="1832" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">Prasyarat: sesi admin aktif. Akun admin disediakan</text>
<text x="428" y="1860" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#202A31">sistem; bukan melalui pendaftaran publik.</text>
<text x="800" y="2040" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#59636B">UC-24 dirinci menjadi kelola toko dan kelola produk. Pemeriksaan konten tidak menahan publikasi awal.</text>
<polyline points="100,2090 1500,2090" fill="none" stroke="#C6CDD2" stroke-width="1"/>
<text x="100" y="2130" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#59636B">PASARIN  |  Revisi 2  |  Ruang lingkup FE interaktif</text>
<text x="1500" y="2130" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#59636B">4 / 4</text>
